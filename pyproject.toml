[project]
name = "proyecto-equipo-3"
version = "0.1.0"
description = "Modelo de riesgo de abandono de clientes (Telco Customer Churn) con pipeline de scikit-learn y API FastAPI"
readme = "README.md"
authors = [
    { name = "Juan Pablo Madrigal Navarro - Johana Marcela Hidalgo", email = "jpabloomn@gmail.com-johanamhz26@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "kagglehub[pandas-datasets]>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
